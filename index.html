<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Smart Schedule Pro</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: #f4f6fb;
  display: flex;
}

/* Sidebar */
.sidebar {
  width: 240px;
  background: linear-gradient(180deg, #2c7be5, #1a5edb);
  color: white;
  padding: 20px;
}
.sidebar h2 {
  margin-bottom: 30px;
}

/* Main */
.main {
  flex: 1;
  padding: 20px;
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 20px;
}

/* Stats */
.stats {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}
.stat-box {
  flex: 1;
  background: white;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
}

/* Card */
.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
}

/* Input */
input {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
  border-radius: 8px;
  border: 1px solid #ddd;
}

/* Button */
button {
  padding: 8px 12px;
  border-radius: 8px;
  border: none;
  background: #2c7be5;
  color: white;
  cursor: pointer;
}

.delete {
  background: red;
}

/* Task */
.task {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px;
  border-radius: 10px;
  margin-top: 10px;
}

.done {
  background: #d4edda;
}

.pending {
  background: #eef4ff;
}

/* Status badge */
.status {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: bold;
}

.status.done {
  background: #d4edda;
  color: #155724;
}

.status.pending {
  background: #fff3cd;
  color: #856404;
}

/* Gạch ngang khi xong */
.task.done b {
  text-decoration: line-through;
  opacity: 0.7;
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>📅 Smart App</h2>
  <p>Quản lý lịch thông minh</p>
</div>

<div class="main">

  <div class="header">
    <h3>Dashboard</h3>
    <span>👤 User</span>
  </div>

  <div class="stats">
    <div class="stat-box" id="total">0<br>Tổng</div>
    <div class="stat-box" id="done">0<br>Hoàn thành</div>
    <div class="stat-box" id="pending">0<br>Chưa xong</div>
  </div>

  <div class="card">
    <h3>➕ Thêm công việc</h3>
    <input id="title" placeholder="Tên công việc">
    <input type="datetime-local" id="time">
    <button onclick="addTask()">Thêm</button>
  </div>

  <div class="card">
    <h3>📌 Công việc</h3>
    <div id="taskList"></div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAJ_VzRze1hPkwgT1ULtsxLvErGvfmP_yM",
  authDomain: "chuyende2-f7eed.firebaseapp.com",
  projectId: "chuyende2-f7eed",
  storageBucket: "chuyende2-f7eed.appspot.com",
  messagingSenderId: "488325114381",
  appId: "1:488325114381:web:2c691a05e24c6407018344"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let tasks = [];

// realtime sync
onSnapshot(collection(db, "tasks"), (snapshot) => {
  tasks = [];
  snapshot.forEach(docSnap => {
    tasks.push({ id: docSnap.id, ...docSnap.data() });
  });
  render();
});

// add
window.addTask = async function () {
  let title = document.getElementById("title").value;
  let time = document.getElementById("time").value;

  if (!title || !time) return alert("Nhập đủ!");

  await addDoc(collection(db, "tasks"), {
    title, time, status: "pending"
  });

  document.getElementById("title").value = "";
  document.getElementById("time").value = "";
};

// delete
window.deleteTask = async function (id) {
  await deleteDoc(doc(db, "tasks", id));
};

// toggle
window.toggleStatus = async function (id, status) {
  await updateDoc(doc(db, "tasks", id), {
    status: status === "done" ? "pending" : "done"
  });
};

// render
function render() {
  let html = "";
  let done = 0;

  tasks.forEach(t => {
    if (t.status === "done") done++;

    html += `
      <div class="task ${t.status}">
        <div>
          <b>${t.title}</b><br>
          ⏰ ${t.time}<br>
          <span class="status ${t.status}">
            ${t.status === "done" ? "✔ Đã hoàn thành" : "⏳ Đang làm"}
          </span>
        </div>

        <div>
          <button onclick="toggleStatus('${t.id}','${t.status}')">✔</button>
          <button class="delete" onclick="deleteTask('${t.id}')">Xóa</button>
        </div>
      </div>
    `;
  });

  document.getElementById("taskList").innerHTML = html;

  document.getElementById("total").innerHTML = tasks.length + "<br>Tổng";
  document.getElementById("done").innerHTML = done + "<br>Hoàn thành";
  document.getElementById("pending").innerHTML = (tasks.length - done) + "<br>Chưa xong";
}
</script>

</body>
</html>
